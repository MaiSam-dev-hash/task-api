stages:
  - test
  - build
  - docker

# Déclenchement automatique uniquement sur la branche develop
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# Commande commune pour installer la dépendance locale
.install_local_deps: &install_local_deps
  - chmod +x mvnw
  - ./mvnw install:install-file -Dfile=lib/task-core-0.3.0.jar -DgroupId=sn.isi.l3gl.core -DartifactId=task-core -Dversion=0.3.0 -Dpackaging=jar

# Job 1 : Exécution des tests unitaires
test:
  stage: test
  image: eclipse-temurin:17-jdk-alpine
  script:
    - *install_local_deps
    - ./mvnw test

# Job 2 : Construction du fichier JAR
build:
  stage: build
  image: eclipse-temurin:17-jdk-alpine
  script:
    - *install_local_deps
    - ./mvnw clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour

# Job 3 : Construction et Push de l'image sur Docker Hub
docker:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    # Authentification sécurisée via les variables GitLab
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    # Construction de l'image avec le tag latest
    - docker build -t $DOCKER_IMAGE:latest .
    # Publication sur Docker Hub
    - docker push $DOCKER_IMAGE:latest
