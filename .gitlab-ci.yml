stages:
  - test
  - build
  - docker


workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"


.install_local_deps: &install_local_deps
  - chmod +x mvnw
  - ./mvnw install:install-file -Dfile=lib/task-core-0.3.0.jar -DgroupId=sn.isi.l3gl.core -DartifactId=task-core -Dversion=0.3.0 -Dpackaging=jar


test:
  stage: test
  image: eclipse-temurin:17-jdk-alpine
  script:
    - *install_local_deps
    - ./mvnw test


build:
  stage: build
  image: eclipse-temurin:17-jdk-alpine
  script:
    - *install_local_deps
    - ./mvnw clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour


docker:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:

    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:

    - docker build -t $DOCKER_IMAGE:latest .

    - docker push $DOCKER_IMAGE:latest
