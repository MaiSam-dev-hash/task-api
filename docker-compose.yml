version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: task-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devops_l3gl
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: task-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_HOST=db
    depends_on:
      - db

volumes:
  mysql_data:
